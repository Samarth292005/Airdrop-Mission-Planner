# Application Configuration
server.port=8080
spring.application.name=airdrop-backend

# H2 In-Memory Database (Default for easy local development)
spring.datasource.url=jdbc:h2:mem:airdropdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# PostgreSQL Configuration (Uncomment to use PostgreSQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/airdrop_db
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Configuration
# Secret key must be at least 256 bits (32 bytes) long (base64 encoded below)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970
# 24 hours in milliseconds
jwt.expiration=86400000
